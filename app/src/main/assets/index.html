<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{--red:#f21d2f;--silver:#d7d9de;--black:#050505;--panel:#101010;--line:#2a2a2a}
*{box-sizing:border-box}body{margin:0;background:var(--black);color:#fff;font-family:Arial,sans-serif}
#top{height:76px;background:#070707;display:flex;align-items:center;padding:8px 12px;gap:10px;border-bottom:1px solid #222}
#top img{height:58px;max-width:74%;object-fit:contain}
#tabs{display:flex;background:#0b0b0b;border-bottom:1px solid #222}
.tab{flex:1;padding:14px 8px;text-align:center;font-weight:bold;color:#aaa}.tab.active{color:#fff;border-bottom:3px solid var(--red)}
#map{height:42vh;min-height:280px}
#panel{padding:12px}
.card{background:var(--panel);border:1px solid #292929;border-radius:16px;padding:14px;margin-bottom:12px}
.big{font-size:38px;font-weight:800;color:var(--red)}.muted{color:#aaa;font-size:13px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
button{background:#171717;color:#fff;border:1px solid #444;border-radius:12px;padding:13px 12px;font-size:15px;font-weight:bold}
button.primary{background:var(--red);border-color:var(--red)}button.secondary{border-color:#666}
input{width:100%;background:#090909;color:#fff;border:1px solid #444;border-radius:10px;padding:11px}
.hidden{display:none}.stop{padding:10px 0;border-bottom:1px solid #252525}.stop:last-child{border-bottom:0}
.badge{display:inline-block;background:#222;border-radius:99px;padding:5px 9px;color:#ddd;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #333;padding:7px;text-align:left}th{background:#191919}tfoot td{font-weight:800;background:#2a0a0d}
#routeList{max-height:250px;overflow:auto}
</style>
</head>
<body>
<div id="top"><img src="file:///android_res/drawable/v_wordmark.jpg"></div>
<div id="tabs"><div id="tReal" class="tab active" onclick="showMode('real')">REALVECTOR</div><div id="tPlan" class="tab" onclick="showMode('plan')">VECTORPLAN</div></div>
<div id="map"></div>
<div id="panel">
  <div id="realPanel">
    <div class="card"><div class="muted">JARAK TEREKAM</div><div class="big"><span id="km">0.00</span> KM</div><div class="muted" id="times">Belum mulai</div></div>
    <div class="row"><button id="recordBtn" class="primary" onclick="toggleRecord()">▶ MULAI RECORD</button><button onclick="centerMe()">◎ LOKASI SAYA</button></div>
    <div class="card"><div class="muted">STATUS</div><div id="realStatus">Siap merekam perjalanan.</div></div>
  </div>

  <div id="planPanel" class="hidden">
    <div class="card">
      <div style="font-weight:800;margin-bottom:8px">Rencana Perjalanan</div>
      <div class="muted">Ketuk peta untuk menambahkan perhentian. Jarak rute dihitung dari OpenStreetMap melalui OSRM.</div>
    </div>
    <div class="card">
      <div id="routeList"></div>
      <div class="row" style="margin-top:10px"><button onclick="clearPlan()">Reset</button><button class="primary" onclick="savePlan()">Simpan Rencana</button></div>
    </div>
    <div class="card">
      <table><thead><tr><th>NOMOR</th><th>TUJUAN</th><th>KM AWAL</th><th>KM AKHIR</th><th>JUMLAH (KM)</th></tr></thead>
      <tbody id="planRows"></tbody>
      <tfoot><tr><td colspan="4">TOTAL</td><td id="planTotal">0.00</td></tr></tfoot></table>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let map=L.map('map',{zoomControl:true}).setView([-6.2,106.82],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
let meMarker=null, trackLine=L.polyline([],{color:'#f21d2f',weight:5}).addTo(map);
let recording=false, last=null, totalKm=0, points=[], plan=[], planMarkers=[], planLines=[];
function showMode(m){
  document.getElementById('realPanel').classList.toggle('hidden',m!=='real');
  document.getElementById('planPanel').classList.toggle('hidden',m!=='plan');
  document.getElementById('tReal').classList.toggle('active',m==='real');
  document.getElementById('tPlan').classList.toggle('active',m==='plan');
}
function toggleRecord(){
  recording=!recording;
  const b=document.getElementById('recordBtn');
  if(recording){b.textContent='■ STOP RECORD'; b.className='secondary'; document.getElementById('realStatus').textContent='Sedang merekam GPS…'; Android.startGps();}
  else{b.textContent='▶ MULAI RECORD'; b.className='primary'; document.getElementById('realStatus').textContent='Perjalanan selesai. Jarak tersimpan untuk sesi ini.'; Android.stopGps();}
}
function onGps(lat,lon){
  const p=L.latLng(lat,lon);
  if(meMarker) meMarker.setLatLng(p); else meMarker=L.marker(p).addTo(map).bindPopup('Lokasi Anda');
  if(recording){
    if(last) totalKm += last.distanceTo(p)/1000;
    last=p; points.push([lat,lon]); trackLine.setLatLngs(points);
    document.getElementById('km').textContent=totalKm.toFixed(2);
    map.setView(p,16);
  }
}
function centerMe(){Android.requestOneLocation();}
function addPlanPoint(lat,lon,name){
  plan.push({lat,lon,name:name||('Titik '+plan.length)});
  const marker=L.marker([lat,lon]).addTo(map).bindTooltip(String(plan.length),{permanent:true,direction:'top'}); planMarkers.push(marker);
  renderPlan();
  if(plan.length>=2) routePlan();
}
map.on('click',e=>{ if(document.getElementById('planPanel').classList.contains('hidden')) return; addPlanPoint(e.latlng.lat,e.latlng.lng,'Titik '+plan.length); });
async function routePlan(){
  planLines.forEach(x=>map.removeLayer(x)); planLines=[];
  let total=0, legs=[];
  for(let i=0;i<plan.length-1;i++){
    const a=plan[i],b=plan[i+1];
    try{
      const u=`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=full&geometries=geojson`;
      const r=await fetch(u); const j=await r.json(); if(j.routes&&j.routes[0]){
        const rt=j.routes[0]; const km=rt.distance/1000; total+=km; legs.push(km);
        const line=L.geoJSON(rt.geometry,{style:{color:'#f21d2f',weight:5}}).addTo(map); planLines.push(line);
      }
    }catch(e){legs.push(0)}
  }
  renderTable(legs,total);
}
function renderPlan(){
  document.getElementById('routeList').innerHTML=plan.map((p,i)=>`<div class="stop"><span class="badge">${i+1}</span> ${escapeHtml(p.name)}</div>`).join('') || '<span class="muted">Belum ada perhentian.</span>';
}
function renderTable(legs,total){
  let start=0, html='';
  for(let i=0;i<legs.length;i++){
    const end=start+legs[i];
    html+=`<tr><td>${i+1}</td><td>${escapeHtml(plan[i].name)} → ${escapeHtml(plan[i+1].name)}</td><td><input id="s${i}" type="number" step="0.01" value="${start.toFixed(2)}" oninput="recalcRows()"></td><td id="e${i}">${end.toFixed(2)}</td><td>${legs[i].toFixed(2)}</td></tr>`;
    start=end;
  }
  if(plan.length) html+=`<tr><td>${plan.length}</td><td>${escapeHtml(plan[plan.length-1].name)} → …</td><td><input id="slast" type="number" step="0.01" value="${start.toFixed(2)}" oninput="recalcRows()"></td><td id="elast">${start.toFixed(2)}</td><td>0.00</td></tr>`;
  document.getElementById('planRows').innerHTML=html; document.getElementById('planTotal').textContent=total.toFixed(2);
}
function recalcRows(){
  let prev=0;
  const rows=document.querySelectorAll('#planRows tr');
  rows.forEach((r,i)=>{const inp=r.querySelector('input'); if(!inp)return; const val=parseFloat(inp.value)||0; const km=parseFloat(r.cells[4].textContent)||0; const end=val+km; r.cells[3].textContent=end.toFixed(2); prev=end;});
}
function clearPlan(){plan=[];planMarkers.forEach(x=>map.removeLayer(x));planMarkers=[];planLines.forEach(x=>map.removeLayer(x));planLines=[];renderPlan();document.getElementById('planRows').innerHTML='';document.getElementById('planTotal').textContent='0.00';}
function savePlan(){Android.savePlan(JSON.stringify(plan));alert('Rencana VectorPlan disimpan di HP.');}
function setStartTime(s){document.getElementById('times').textContent='Start: '+s;}
function setEndTime(s){document.getElementById('times').textContent+='  •  Finish: '+s;}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
renderPlan();
</script>
</body>
</html>
